{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>맛집 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-10">🍽 나의 맛집 리스트</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for restaurant in restaurants %}
            <div class="bg-white shadow-lg rounded-2xl overflow-hidden hover:scale-105 transform transition duration-300">
                <img src="{{ restaurant.image }}" alt="{{ restaurant.name }}" class="w-full h-48 object-contain">
                <div class="p-4">
                    <h2 class="text-xl font-semibold mb-2">{{ restaurant.name }}</h2>
                    <p class="text-gray-600 text-sm mb-2">📍 {{ restaurant.location }}</p>
                    <p class="text-gray-700 text-sm mb-4 line-clamp-3">{{ restaurant.context }}</p>

                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span>등록일: {{ restaurant.created_at|date:"Y-m-d" }}</span>
                        {% if restaurant.naver_link %}
                        <a href="{{ restaurant.naver_link }}" target="_blank" class="text-green-600 font-medium hover:underline">
                            네이버 보기 ↗
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% empty %}
            <p class="col-span-3 text-center text-gray-500">등록된 맛집이 없습니다.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
